    <!-- ========== CONTACT ========== -->
        <section id="contact" class="section section--claire">
        <div class="conteneur">
            <h2>Contact</h2>
            <p class="section__intro">Une question, une proposition ? Écrivez-moi.</p>

            <form class="formulaire" action="#" method="post">
            <label for="nom">Nom</label>
            <input id="nom" name="nom" type="text" placeholder="Entrer votre name">

            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" placeholder="exemple@gmail.com">

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" placeholder="votre question"></textarea>

            <button class="bouton" type="submit">Envoyer</button>
            </form>
            <ul class="reseaux">
              
            <li><a class="lien" href="https://github.com" target="_blank"><img class="reseaux__image" src="images/github.png" alt="Social media icons" width="50" height="50">  GitHub</a></li>
            
            <li><a class="lien" href="https://linkedin.com" target="_blank"><img class="reseaux__image" src="images/linkdin.jpg" alt="Social media icons" width="50" height="50">  LinkedIn</a></li>
            
            <li><a class="lien" href="https://x.com" target="_blank"><img class="reseaux__image" src="images//xtwit.jpg" alt="Social media icons" width="50" height="50">Twitter</a></li>
           
            <li><a class="lien" href="https://telegram.org" target="_blank"> <img class="reseaux__image" src="images/telegram.png" alt="Social media icons" width="50" height="50">  Telegram</a></li>
            </ul>
        </div>
        </section>
